name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release pull request
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and publish extension
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Verify release version
        working-directory: extension
        run: node scripts/verify-release-version.mjs "${RELEASE_VERSION}"

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Check types
        working-directory: extension
        run: npm run check

      - name: Run tests
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Package extension
        run: |
          ARCHIVE_NAME="snapinsight-${RELEASE_VERSION}.zip"
          mkdir -p release
          cd extension/dist
          zip -qr "../../release/${ARCHIVE_NAME}" .
          cd ../..
          shasum -a 256 "release/${ARCHIVE_NAME}" > "release/${ARCHIVE_NAME}.sha256"
          unzip -p "release/${ARCHIVE_NAME}" manifest.json | grep -F "\"version\": \"${RELEASE_VERSION}\""

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapinsight-${{ needs.release-please.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Prepare verified release notes
        run: |
          node extension/scripts/extract-release-notes.mjs \
            "${RELEASE_VERSION}" CHANGELOG.md > release-notes.md
          {
            echo
            echo "## Verification"
            echo
            echo "- TypeScript type checking passed."
            echo "- Automated tests passed."
            echo "- Production build completed successfully."
            echo
            echo '```text'
            cat "release/snapinsight-${RELEASE_VERSION}.zip.sha256"
            echo '```'
            echo
            echo "[Changelog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)"
          } >> release-notes.md

      - name: Attach verified assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          ARCHIVE_PATH="release/snapinsight-${RELEASE_VERSION}.zip"
          CHECKSUM_PATH="${ARCHIVE_PATH}.sha256"
          gh release upload "${RELEASE_TAG}" \
            "${ARCHIVE_PATH}" "${CHECKSUM_PATH}" --clobber
          gh release edit "${RELEASE_TAG}" \
            --title "SnapInsight ${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --draft=false
